services:
  postgres:
    image: postgres:17-alpine
    container_name: notes-vault-db
    environment:
      POSTGRES_DB: notes_vault
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: